<!DOCTYPE html>

    <head>

        @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');

    <body>

        <!-- navigation bar -->
        <div id="navbar"></div>

        <!-- hero section -->

        <section class=" hero  d-flex align-items-center pt-5">
            <div class="container">


                <div class="row align-items-center g-5 ">
                    <div class="col-lg-6 col-12">
                        <h1 class="text-white fw-bold display-2 mb-4"
                            style="letter-spacing:-.5px; max-width:650px;">Grow
                            at the speed of
                            your
                            ambition</h1>
                        <p class="text-light opacity-75 mb-4"
                            style="max-width:440px;">Book
                            trusted, vetted help for cleaning, repairs, moving
                            and more —
                            scheduled in minutes, done on your terms.</p>
                        <form
                            class="d-flex bg-white rounded-pill p-1 ps-3 shadow"
                            style="max-width:480px;" onsubmit="return false;">
                            <input type="text" placeholder="What do you need done?"
                                class="form-control flex-grow-1 border-0 shadow-none">
                            <button type="submit"
                                class="btn btn-brand btn-primary rounded-pill px-4 text-nowrap">Find
                                talent</button>
                        </form>
                    </div>
                    <div class="col-lg-6 d-flex justify-content-center">
                        <div class="row row-cols-4 g-2 hero-collage">
                            <div  class="col"><img style="object-position: 70% 100%;" class="img-fluid w-100 rounded"
                                    src="./Assets/s5.jpeg"
                                    alt="Handyman at work"></div>
                            <div class="col"><img class="img-fluid w-100 rounded"
                                    src="./Assets/s2.jpeg"
                                    alt="Repair tools"></div>
                            <div class="col"><img style="object-position: 40% 100%;" class="img-fluid w-100 rounded"
                                    src="./Assets/s1.jpeg"
                                    alt="Yardwork"></div>
                            <div class="col"><img style="object-position: 60% 100%;" class="img-fluid w-100 rounded"
                                    src="./Assets/robinson-greig-HrnAxAUwle8-unsplash.jpg"
                                    alt="Furniture assembly"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- end of hero section -->



        <!-- ===== SERVICES ===== -->
        <section>

                <h2>Our Services</h2>
