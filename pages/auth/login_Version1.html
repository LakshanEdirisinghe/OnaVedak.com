<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnaVedak - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand" href="./index.html">OnaVedak.com</a>
      <div>
        <a class="btn btn-outline-primary me-2" href="./signup_Version2.html">Sign up</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="mb-3">Log in</h4>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" required>
              </div>

              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember me</label>
              </div>

              <div id="loginAlert" class="alert d-none" role="alert"></div>

              <div class="d-grid mb-2">
                <button class="btn btn-primary" type="submit">Log in</button>
              </div>

              <div class="text-center">
                <a href="./forgot-password_Version1.html">Forgot password?</a>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('loginForm');
      const alertEl = document.getElementById('loginAlert');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        alertEl.classList.add('d-none');

        const email = document.getElementById('loginEmail').value.trim().toLowerCase();
        const password = document.getElementById('loginPassword').value;
        const remember = document.getElementById('rememberMe').checked;

        const user = findUserByEmail(email);
        if (!user || user.password !== password) {
          alertEl.textContent = 'Invalid email or password.';
          alertEl.className = 'alert alert-danger';
          alertEl.classList.remove('d-none');
          return;
        }

        // Save session
        setCurrentUser(user.id, remember);

        alertEl.textContent = 'Login successful. Redirecting...';
        alertEl.className = 'alert alert-success';
        alertEl.classList.remove('d-none');

        setTimeout(() => { window.location.href = 'dashboard.html'; }, 700);
      });
    });
  </script>
</body>
</html>
