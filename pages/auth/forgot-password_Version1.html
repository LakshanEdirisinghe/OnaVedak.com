<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OnaVedak - Forgot Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link href="/CSS/auth V2/assets_css_custom_Version2.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3 ms-4" href="/index.html">Ona<span
            style="color: #2f5bff;"
            class="text-brand ">Vedak</span>.com</a>
        <div>
          <a class="btn btn-outline-primary me-2"
            href="./login_Version1.html">Log in</a>
          <a class="btn btn-outline-secondary"
            href="./signup_Version2.html">Sign up</a>
        </div>
      </div>
    </nav>

    <main class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h5 class="mb-3">Reset your password</h5>

              <!-- Step 1: Verify identity -->
              <form id="verifyForm">
                <p class="small text-muted">Enter the email and the contact
                  number that you registered with. This demo will verify these
                  and allow setting a new password.</p>

                <div class="mb-3">
                  <label class="form-label">Registered email</label>
                  <input type="email" id="verifyEmail" class="form-control"
                    required>
                </div>

                <div class="mb-3">
                  <label class="form-label">Registered contact number</label>
                  <input type="tel" id="verifyContact" class="form-control"
                    required>
                </div>

                <div id="verifyAlert" class="alert d-none" role="alert"></div>

                <div class="d-grid">
                  <button class="btn btn-primary" type="submit">Verify</button>
                </div>
              </form>

              <!-- Step 2: Set new password (hidden until verification passes) -->
              <form id="resetForm" class="d-none mt-3">
                <div class="mb-3">
                  <label class="form-label">New password</label>
                  <input type="password" id="newPassword" class="form-control"
                    minlength="8" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Confirm new password</label>
                  <input type="password" id="confirmNewPassword"
                    class="form-control" minlength="8" required>
                </div>
                <div id="resetAlert" class="alert d-none" role="alert"></div>
                <div class="d-grid">
                  <button class="btn btn-success" type="submit">Set new
                    password</button>
                </div>
              </form>

            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/js/auth/auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
      const verifyForm = document.getElementById('verifyForm');
      const resetForm = document.getElementById('resetForm');
      const verifyAlert = document.getElementById('verifyAlert');
      const resetAlert = document.getElementById('resetAlert');

      let matchedUserId = null;

      verifyForm.addEventListener('submit', function (e) {
        e.preventDefault();
        verifyAlert.classList.add('d-none');

        const email = document.getElementById('verifyEmail').value.trim().toLowerCase();
        const contact = document.getElementById('verifyContact').value.trim();

        const user = findUserByEmail(email);
        if (!user || user.contact !== contact) {
          verifyAlert.textContent = 'No matching account found for that email and contact number.';
          verifyAlert.className = 'alert alert-danger';
          verifyAlert.classList.remove('d-none');
          return;
        }

        matchedUserId = user.id;
        verifyAlert.textContent = 'Identity verified. Please set a new password below.';
        verifyAlert.className = 'alert alert-success';
        verifyAlert.classList.remove('d-none');

        verifyForm.classList.add('d-none');
        resetForm.classList.remove('d-none');
      });

      resetForm.addEventListener('submit', function (e) {
        e.preventDefault();
        resetAlert.classList.add('d-none');

        const newPassword = document.getElementById('newPassword').value;
        const confirmNewPassword = document.getElementById('confirmNewPassword').value;

        if (newPassword.length < 8) {
          resetAlert.textContent = 'Password must be at least 8 characters.';
          resetAlert.className = 'alert alert-danger';
          resetAlert.classList.remove('d-none');
          return;
        }
        if (newPassword !== confirmNewPassword) {
          resetAlert.textContent = 'Passwords do not match.';
          resetAlert.className = 'alert alert-danger';
          resetAlert.classList.remove('d-none');
          return;
        }

        // update user
        const user = getUserById(matchedUserId);
        if (!user) {
          resetAlert.textContent = 'Unexpected error: user not found.';
          resetAlert.className = 'alert alert-danger';
          resetAlert.classList.remove('d-none');
          return;
        }
        user.password = newPassword; // DEMO: plaintext
        updateUser(user);

        resetAlert.textContent = 'Password updated successfully. Redirecting to login...';
        resetAlert.className = 'alert alert-success';
        resetAlert.classList.remove('d-none');

        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
      });

    });
  </script>
  </body>
</html>
