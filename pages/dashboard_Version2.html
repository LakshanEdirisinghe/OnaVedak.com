<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnaVedak - Dashboard</title>

   
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>

  <body class="dashboard-view">
    <!-- Sidebar Navigation -->
    <aside class="dashboard-sidebar">
      <!-- Sidebar content will be rendered by JS -->
    </aside>

    <!-- Main Content Area -->
    <div class="dashboard-main">
      <!-- Top Bar -->
      <header class="dashboard-topbar">
        <!-- Topbar content will be rendered by JS -->
      </header>

      <!-- Dashboard Content -->
      <main class="dashboard-content">
        <!-- Onboarding Section -->
        <section data-section="onboarding">
          <!-- Onboarding steps will be rendered by JS -->
        </section>

        <!-- Overview Section -->
        <section data-section="overview">
          <!-- Overview cards will be rendered by JS -->
        </section>

        <!-- Jobs/Tasks Section -->
        <section data-section="jobs">
          <!-- Jobs section will be rendered by JS -->
        </section>
      </main>
    </div>

    <!-- Scripts -->
    <script src="/js/auth/auth.js"></script>
    <script src="/js/dashboard.js"></script>

    <script>
      // Setup Bootstrap for tooltips (if needed later)
      var tooltipTriggerList = [].slice.call(
        document.querySelectorAll('[data-bs-toggle="tooltip"]')
      );
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });
    </script>
  </body>
</html>
