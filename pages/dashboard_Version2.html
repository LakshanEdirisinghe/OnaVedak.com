<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnaVedak - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/CSS/auth V2/assets_css_custom_Version2.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">OnaVedak.com</a>
      <div>
        <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div id="profileCard" class="card shadow-sm mx-auto" style="max-width:720px;">
      <div class="card-body">
        <h5 id="welcomeName" class="card-title"></h5>
        <p id="joinedAt" class="text-muted small"></p>

        <div class="row g-3">
          <div class="col-md-4 text-center">
            <img id="profilePhoto" src="" alt="ID photo" class="img-fluid img-thumbnail">
          </div>
          <div class="col-md-8">
            <p><strong>Email:</strong> <span id="profileEmail"></span></p>
            <p><strong>Contact:</strong> <span id="profileContact"></span></p>
            <p><strong>Location:</strong> <span id="profileLocation"></span></p>
            <p><strong>Skills / Summary:</strong> <span id="profileSkills"></span></p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="/js/auth/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const currentUser = getCurrentUser();
      if (!currentUser) {
        // not logged in
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('welcomeName').textContent = 'Welcome, ' + currentUser.name;
      document.getElementById('joinedAt').textContent = 'Member since ' + new Date(currentUser.createdAt).toLocaleString();
      document.getElementById('profileEmail').textContent = currentUser.email;
      document.getElementById('profileContact').textContent = currentUser.contact;
      document.getElementById('profileLocation').textContent = currentUser.location || '-';
      document.getElementById('profileSkills').textContent = currentUser.skills || '-';
      document.getElementById('profilePhoto').src = currentUser.idPhoto || '';

      document.getElementById('logoutBtn').addEventListener('click', function () {
        clearCurrentUser();
        window.location.href = '/index.html';
      });
    });

    console.log('Dashboard script loaded');
  </script>
</body>
</html>
