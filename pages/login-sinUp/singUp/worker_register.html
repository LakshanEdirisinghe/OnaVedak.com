<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<link rel="stylesheet" href="..\..\..\css\singin&singUp-style.css">
</head>
<body>
	<div class="wrapper">
		<span class="bg-animate"></span>
		<span class="bg-animate2"></span>
			<div class="form-box register">
			<h2 class="animation" style="--i:17; --j:0;">Sing Up Worker</h2>
			<form action="#">


<div class="name-row animation" style="--i:18;--j:1;">

    <div class="input-box">
        <input type="text" required>
        <label>First Name</label>
        <i class="bx bx-user"></i>
    </div>

    <div class="input-box">
        <input type="text" required>
        <label>Last Name</label>
        <i class="bx bx-user"></i>
    </div>

</div>
<div class="name-row animation" style="--i:18;--j:1;">

    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
        <label>Gender</label>
        <i class='bx bx-chevron-down'></i>
    </div>

    <div class="input-box">
        <input type="text" required>
        <label>DOB</label>
        <i class="bx bx-calendar"></i>
    </div>

    <div class="input-box">
        <input type="text" required>
        <label>NIC</label>
        <i class="bx bx-id-card"></i>
    </div>

</div>
<div class="email-phone-row animation" style="--i:19; --j:2;">

    <div class="input-box">
        <input type="email" required>
        <label>Email</label>
        <i class="bx bxs-envelope"></i>
    </div>

    <div class="input-box">
        <input type="tel" required>
        <label>Telephone Number</label>
        <i class="bx bx-phone"></i>
    </div>

</div>
<div class="location-row animation" style="--i:20; --j:3;">

    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>Grade 5-10</option>
            <option>O/L</option>
            <option>A/L</option>
            <option>NVQ</option>
            <option>Diploma</option>
            <option>HND</option>
            <option>Bachelor's Degree</option>
            <option>Master's Degree</option>
            <option>Other</option>
        </select>
        <label>Education Type</label>
        <i class='bx bx-chevron-down'></i>
    </div>

    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>Student</option>
            <option>Software Engineer</option>
            <option>Web Developer</option>
            <option>Graphic Designer</option>
            <option>Electrician</option>
            <option>Plumber</option>
            <option>Driver</option>
            <option>Carpenter</option>
            <option>Teacher</option>
            <option>Accountant</option>
            <option>Data Entry Operator</option>
            <option>Sales Executive</option>
            <option>Business Owner</option>
            <option>Freelancer</option>
            <option>Unemployed</option>
            <option>Other</option>
        </select>
        <label>Job title</label>
        <i class='bx bx-chevron-down'></i>
    </div>

    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>No Experience</option>
            <option>Less than 1 Year</option>
            <option>1–2 Years</option>
            <option>3–5 Years</option>
            <option>6–10 Years</option>
            <option>More than 10 Years</option>
        </select>
        <label>Experiace</label>
        <i class='bx bx-chevron-down'></i>
    </div>

</div>
<div class="three-row animation" style="--i:19;--j:2;">

    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>Daily</option>
            <option>Hourly</option>
        </select>

        <label>Charge Type</label>
        <i class='bx bx-chevron-down'></i>
    </div>


    <div class="input-box">
        <input type="text" required>
        <label>Rate</label>
        <i class="bx bx-money"></i>
    </div>


    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>Yes</option>
            <option>No</option>
        </select>

        <label>Emergency Service Available</label>
        <i class='bx bx-chevron-down'></i>
    </div>

</div>

<div class="location-row animation" style="--i:20; --j:3;">

    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>Western</option>
            <option>Central</option>
            <option>Southern</option>
            <option>Northern</option>
            <option>Eastern</option>
            <option>North Western</option>
            <option>North Central</option>
            <option>Uva</option>
            <option>Sabaragamuwa</option>
        </select>
        <label>Province</label>
        <i class='bx bx-chevron-down'></i>
    </div>

    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>Colombo</option>
            <option>Gampaha</option>
            <option>Kalutara</option>
            <option>Kandy</option>
            <option>Matale</option>
            <option>Nuwara Eliya</option>
            <option>Galle</option>
            <option>Matara</option>
            <option>Hambantota</option>
            <option>Jaffna</option>
            <option>Kilinochchi</option>
            <option>Mannar</option>
            <option>Vavuniya</option>
            <option>Mullaitivu</option>
            <option>Batticaloa</option>
            <option>Ampara</option>
            <option>Trincomalee</option>
            <option>Kurunegala</option>
            <option>Puttalam</option>
            <option>Anuradhapura</option>
            <option>Polonnaruwa</option>
            <option>Badulla</option>
            <option>Monaragala</option>
            <option>Ratnapura</option>
            <option>Kegalle</option>
        </select>
        <label>District</label>
        <i class='bx bx-chevron-down'></i>
    </div>

    <div class="input-box">
        <select required>
            <option value="" disabled selected></option>
            <option>Colombo</option>
            <option>Gampaha</option>
            <option>Kalutara</option>
            <option>Kandy</option>
            <option>Matale</option>
            <option>Nuwara Eliya</option>
            <option>Galle</option>
            <option>Matara</option>
            <option>Hambantota</option>
            <option>Jaffna</option>
        </select>
        <label>City</label>
        <i class='bx bx-chevron-down'></i>
    </div>

</div>

<div class="address-row animation" style="--i:21; --j:4;">

    <div class="input-box">
        <input type="text" required>
        <label>Address</label>
        <i class="bx bx-home"></i>
    </div>

    <div class="input-box">
        <input type="text" required>
        <label>Postal Code</label>
        <i class="bx bx-map"></i>
    </div>

</div>		
<div class="name-row animation" style="--i:21; --j:4;">

    <div class="input-box">
        <input type="password" required>
        <label>Password</label>
        <i class="bx bx-lock"></i>
    </div>

    <div class="input-box">
        <input type="password" required>
        <label>Confirm Password</label>
        <i class="bx bx-lock"></i>
    </div>

</div>
				<button type="submit" class="btn animation" style="--i:21; --j:4;">Sing Up</button>
				<div class="logreg-link animation" style="--i:22; --j:5;">
					<p>
						Already have an account?<a href="#" class="login-link">Login</a>
					</p>
				</div>
			</form>
		</div>
		<!--<div class="info-text register">
			<h2 class="animation" style="--i:17; --j:0;">Welcome Back!</h2>
			<p class="animation" style="--i:18; --j:1;">Lorem ipsum dolor sit amet, consectetur adipisicing</p>
			
		</div>-->
	</div>
	<script src="..\..\..\js\script.js"></script>
</body>
</html>
